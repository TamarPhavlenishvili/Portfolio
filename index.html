<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob: data:; font-src 'self' blob: data:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self'; base-uri 'self'; form-action 'none'"><title>Private portfolio preview</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0d0c0c;color:#f6f0e6;font:16px/1.6 system-ui,Arial,sans-serif}#gate{min-height:100svh;display:grid;place-items:center;padding:24px}main{width:min(100%,460px)}h1{font-size:38px;letter-spacing:-.04em;line-height:1.15}p{color:#c6bdb6}label{display:block;font-size:14px;margin-bottom:8px}input{width:100%;font:16px system-ui;padding:14px;border:1px solid #66505b;background:#191316;color:inherit;border-radius:5px}button{font:700 14px system-ui;min-height:44px;border:1px solid #ff9ec7;border-radius:5px;background:#ff9ec7;color:#0d0c0c;padding:12px 18px;cursor:pointer}#unlock{width:100%;margin-top:14px}#status{min-height:30px;font-size:13px}small{color:#a89ca4;font-size:12px}.hidden{display:none!important}#viewer{position:fixed;inset:0;display:flex;flex-direction:column}.toolbar{flex:none;min-height:48px;display:flex;gap:9px;align-items:center;justify-content:center;padding:5px 10px;background:#0d0c0c;border-bottom:1px solid #44323b}.toolbar button{min-height:36px;font-size:12px;padding:6px 13px;background:transparent;color:#f6f0e6;border-color:#6e4b5b}.toolbar button[aria-pressed=true]{background:#ff9ec7;color:#0d0c0c;border-color:#ff9ec7}.toolbar #lock{margin-left:auto}.toolbar span{font-size:11px;color:#a89ca4;margin-right:auto}iframe{display:block;width:100%;height:100%;min-height:0;flex:1;border:0;background:#0d0c0c}button:focus-visible,input:focus-visible{outline:2px solid white;outline-offset:3px}</style></head><body><div id="gate"><main><small>PRIVATE REVIEW</small><h1>Portfolio preview.</h1><p>This preview is encrypted. Use your private access link or enter the access code.</p><form id="accessForm"><label for="access">Access code</label><input id="access" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required><button id="unlock" type="submit">Open preview</button></form><p id="status" role="status" aria-live="polite"></p><small>Keep the complete access link private. Anyone with that link can view this preview.</small></main></div><div id="viewer" class="hidden"><div class="toolbar"><span>PRIVATE PREVIEW</span><button data-version="1" aria-pressed="true">Version 1</button><button data-version="2" aria-pressed="false">Version 2</button><button id="lock">Lock</button></div><iframe id="portfolio" title="Interactive portfolio preview" allow="autoplay; fullscreen" referrerpolicy="no-referrer"></iframe></div><script>
(function(){let pack=null,token=null,worker=null;const assetURLs=new Map();const status=document.getElementById('status'),input=document.getElementById('access'),frame=document.getElementById('portfolio'),form=document.getElementById('accessForm');const root=new URL('./',location.href);
function keyBytes(text){const value=text.trim().replace(/-/g,'+').replace(/_/g,'/'),raw=atob(value);return Uint8Array.from(raw,c=>c.charCodeAt(0))}
async function sendSession(){return new Promise((resolve,reject)=>{const channel=new MessageChannel(),timer=setTimeout(()=>reject(Error('Preview setup timed out. Open this link in Safari and try again.')),10000);channel.port1.onmessage=e=>{clearTimeout(timer);resolve(e.data)};(navigator.serviceWorker.controller||worker).postMessage({type:'unlock',token,files:pack.files},[channel.port2])})}
function clearAssets(){assetURLs.forEach(url=>URL.revokeObjectURL(url));assetURLs.clear()}
function showVersion(n){let html=atob(pack.files['variant-'+n+'.html'].data);html=new TextDecoder().decode(Uint8Array.from(html,c=>c.charCodeAt(0)));html=html.replace(/assets\/[a-f0-9]+\.[a-z0-9]+/g,path=>{if(assetURLs.has(path))return assetURLs.get(path);const file=pack.files[path];if(!file)return path;const raw=atob(file.data),bytes=Uint8Array.from(raw,c=>c.charCodeAt(0)),url=URL.createObjectURL(new Blob([bytes],{type:file.type}));assetURLs.set(path,url);return url});frame.removeAttribute('src');frame.srcdoc=html;document.querySelectorAll('[data-version]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.version===String(n))))}
async function unlock(access){document.getElementById('unlock').disabled=true;status.textContent='Unlocking the preview…';try{if(!window.crypto||!crypto.subtle)throw Error('Open the complete private link in Safari or Chrome. This document viewer does not support the preview.');const response=await fetch('portfolio-61c5a7bdd31367e0.bin',{cache:'no-store'});if(!response.ok)throw Error('The preview could not be downloaded. Please try again.');const all=new Uint8Array(await response.arrayBuffer());if(new TextDecoder().decode(all.slice(0,4))!=='PPV1')throw Error('Invalid preview file.');const key=await crypto.subtle.importKey('raw',keyBytes(access),'AES-GCM',false,['decrypt']);const decoded=await crypto.subtle.decrypt({name:'AES-GCM',iv:all.slice(4,16)},key,all.slice(16));pack=JSON.parse(new TextDecoder().decode(decoded));token=Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');input.value='';status.textContent='';document.getElementById('gate').classList.add('hidden');document.getElementById('viewer').classList.remove('hidden');showVersion(1)}catch(error){pack=null;form.classList.remove('hidden');status.textContent=error.name==='OperationError'||error.name==='InvalidCharacterError'?'The access code is incorrect. Use the complete private link.':error.message}finally{document.getElementById('unlock').disabled=false}}
form.addEventListener('submit',e=>{e.preventDefault();unlock(input.value)});document.querySelectorAll('[data-version]').forEach(button=>button.addEventListener('click',()=>showVersion(Number(button.dataset.version))));document.getElementById('lock').onclick=()=>{if(token&&(navigator.serviceWorker.controller||worker))(navigator.serviceWorker.controller||worker).postMessage({type:'lock',token});frame.removeAttribute('srcdoc');frame.src='about:blank';clearAssets();pack=null;token=null;document.getElementById('viewer').classList.add('hidden');document.getElementById('gate').classList.remove('hidden');history.replaceState(null,'',location.pathname);input.focus()};navigator.serviceWorker&&navigator.serviceWorker.addEventListener('message',event=>{if(event.data&&event.data.type==='need-session'&&event.data.token===token&&pack)sendSession().catch(()=>{status.textContent='Reopen your private access link.'})});const access=new URLSearchParams(location.hash.slice(1)).get('access');if(access){form.classList.add('hidden');unlock(access)}
})();
